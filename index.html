<head>

    <style>
        :root {
            --color-page: #011724;
            --color-ink: #adc7a9;
            --page-padding: clamp(0.75rem, 2vw, 2rem);
            --gap: clamp(0.75rem, 2vh, 1.5rem);
            --fade: 3000ms;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        html {
            background: var(--color-page);
        }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            color: var(--color-ink);
            font-family: Helvetica, Arial, sans-serif;
        }

        .page {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            padding: var(--page-padding);
        }

        .slider {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            container-type: size;
        }

        .slider-frame {
            position: relative;
            width: min(100%, 100cqh);
            aspect-ratio: 1 / 1;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            opacity: 0;
            transition: opacity var(--fade) ease-in-out;
        }

        .slide.is-active {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: none;
            }
        }

        .signup {
            flex: 0 0 auto;
            width: min(100%, 28rem);
        }

        /* Mailchimp overrides */
        #mc_embed_signup {
            background: transparent;
            color: var(--color-ink);
            font: inherit;
            width: 100%;
        }

        #mc_embed_signup form {
            margin: 0;
            padding: 0;
            text-align: center;
        }

        #mc_embed_signup #mc_embed_signup_scroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #mc_embed_signup h2 {
            margin: 0 0 0.5rem;
            font-size: clamp(0.95rem, 2.2vw, 1.25rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--color-ink);
        }

        #mc_embed_signup label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        #mc_embed_signup .mc-field-group {
            width: 100%;
            margin: 0;
            padding: 0;
            min-height: 0;
        }

        #mc_embed_signup .mc-field-group input {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0;
            text-indent: 0;
        }

        #mc_embed_signup .mc-field-group input.email {
            width: 100%;
            height: 2.5rem;
            margin: 0;
            padding: 0 0.75rem;
            text-align: center;
            background: transparent;
            color: var(--color-ink);
            border: 1px solid var(--color-ink);
            border-radius: 0;
            font: inherit;
            font-size: 0.95rem;
        }

        #mc_embed_signup input.email::placeholder {
            color: var(--color-ink);
            opacity: 0.6;
        }

        #mc_embed_signup input.button,
        #mc_embed_signup .button {
            display: block;
            width: 100%;
            height: 2.5rem;
            line-height: 2.5rem;
            margin: 0.5rem 0 0;
            padding: 0;
            text-align: center;
            background: var(--color-ink);
            color: var(--color-page);
            border: 0;
            border-radius: 0;
            font: inherit;
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
        }

        #mc_embed_signup input.button:hover {
            background: #fff;
        }

        #mc_embed_signup .optionalParent,
        #mc_embed_signup .clear.foot {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        #mc_embed_signup div#mce-responses {
            float: none;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        #mc_embed_signup div.response {
            margin: 0.5rem 0 0;
            padding: 0;
            width: 100%;
            float: none;
            font-size: 0.85rem;
            text-align: center;
            color: var(--color-ink);
        }

        #mc_embed_signup #mce-error-response,
        #mc_embed_signup #mce-success-response {
            color: var(--color-ink);
            font-weight: 400;
        }

        #mc_embed_signup .helper_text {
            display: none;
        }

        #mc_embed_signup #mc-embedded-subscribe-form input.mce_inline_error {
            border: 1px solid #fff;
        }

        #mc_embed_signup #mc-embedded-subscribe-form div.mce_inline_error {
            display: block;
            width: 100%;
            margin: 0.4rem 0 0;
            padding: 0;
            background: transparent;
            border-radius: 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--color-ink);
        }

        #mc_embed_signup #mc-embedded-subscribe-form input:focus {
            outline: none;
            border-color: #fff;
        }

        #mc_embed_signup input.button:focus-visible {
            background: var(--color-ink);
            outline: 1px solid #fff;
            outline-offset: 2px;
        }

        @media (max-width: 36rem) {
            :root {
                --page-padding: 0.75rem;
            }

            #mc_embed_signup h2 {
                margin-bottom: 0.4rem;
            }
        }

        @media (max-height: 30rem) {
            .page {
                flex-direction: row;
            }

            .slider {
                height: 100%;
                width: auto;
                flex: 1 1 auto;
            }

            .signup {
                width: min(45%, 22rem);
            }
        }
    </style>
</head>

    <script>
        (function () {
            const slides = [...document.querySelectorAll('.slide')];
            let index = 0;
            let timer = null;

            function tick() {
                slides[index].classList.remove('is-active');
                index = (index + 1) % slides.length;
                slides[index].classList.add('is-active');
            }

            function start() {
                if (timer === null) timer = setInterval(tick, 6000); // 3s hold + 3s crossfade
            }

            function stop() {
                clearInterval(timer);
                timer = null;
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop(); else start();
            });

            const first = slides[0];
            if (first.complete) start();
            else first.addEventListener('load', start, { once: true });
        })();
    </script>
